        function selectQ(q) {
            query=q;

        function widget() {
            var ctype = 0;
	    if (document.getElementById("aF").style.display == 'block') ctype = 1;

        var red, rContent = function (data) {

        };

        var elem0 = document.createElement('script');

        document.getElementsByTagName('head')[0].appendChild(elem0);

        elem0.onload = elem0.onreadystatechange = function () {
            if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
                var lhtml = "", checkel = true;
                var lls = red.parse.langlinks;
                for (var i = 0; i < lls.length; i++) {
                    if (checkel && lls[i].lang > "el") {
                        if (lang == "https://el.wikipedia.org/") lhtml += '<option value="https://el.wikipedia.org/" selected>Ελληνικά</option>';
                        else lhtml += '<option value="https://el.wikipedia.org/">Ελληνικά</option>';
                        checkel = false;
                    }
                    var lval = "https://" + lls[i].lang + ".wikipedia.org/";
                    if (lval == lang) lhtml += '<option value="' + lval + '" selected>' + lls[i].autonym + '</option>';
                    else lhtml += '<option value="' + lval + '">' + lls[i].autonym + '</option>';

        var spellcheck = function (data) {
            var text = data[0];

            document.getElementById('spellcheckinput').style.color = "silver";
            document.getElementById('ws').disabled = true;
            document.getElementById('cc').disabled = true;
            document.getElementById('cc').style.opacity = 0.5;

            if (text != document.getElementById('spellcheckinput').value)
                return;

            document.getElementById('drop_down').innerHTML = "";
            document.getElementById('drop_down').style.left = document.getElementById("spellcheckinput").offsetLeft + "px";
            document.getElementById('drop_down').style.top = document.getElementById("spellcheckinput").offsetTop + document.getElementById("spellcheckinput").offsetHeight + "px";

            if (data[1].length > 0) document.getElementById('drop_down').style.display = "block";

            for (var i = 0; i < data[1].length; i++) document.getElementById('drop_down').innerHTML += "<li onclick='selectQ(this.innerHTML);'>" + data[1][i] + "</li>";

            if (text.toLowerCase().trim() == data[1][0].toLowerCase()) {
                document.getElementById('spellcheckinput').style.color = "black";
                document.getElementById('ws').disabled = false;
                document.getElementById('cc').disabled = false;
                document.getElementById('cc').style.opacity = 1;

        };

            lang = document.getElementById('lang').value;

            var elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);
        };
        var randP = function (q) {
	    if (q != "") {
		document.getElementById('spellcheckinput').value = q;
		document.getElementById('spellcheckinput').style.color = "black";
		document.getElementById('ws').disabled = false;
		document.getElementById('cc').disabled = false;

                document.getElementById("drop_down").style.display = 'none';

		document.getElementById('checks').innerHTML = "";
                document.getElementById("thumbnail").style.display = "none";
                document.getElementById("photo").style.display = "none";
                document.getElementById("description").style.display = "none";
                document.getElementById("expand").style.display = "none";
                document.getElementById("more").style.display = "none";
                document.getElementById("shuffle").innerHTML = "";

                query = document.getElementById("spellcheckinput").value;
                qcat = true;

		if (document.getElementById("aF").style.display == 'block') startA();
		else startK();
		return;
	    }
            var scr = lang + 'w/api.php?action=query&generator=random&grnlimit=500&grnnamespace=0|14&prop=info&format=json&callback=rContent';
			
            var elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);
            elem.onload = elem.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
		    var maxl = 0;
                    for (var key in red.query.pages) {
                       	var length = red.query.pages[key].length;
                       	if (length > maxl) {
                    	   query = red.query.pages[key].title;
                           maxl = length;
                       	}
                    }
                    document.getElementById('spellcheckinput').value = query;
                    document.getElementById('spellcheckinput').style.color = "black";
                    document.getElementById('ws').disabled = false;
                    document.getElementById('cc').disabled = false;

        };
        var httpGet = function (q) {
            query = document.getElementById("spellcheckinput").value;
            document.getElementById("drop_down").style.display = 'none';
            document.getElementById('popup').style.display = 'none';
            document.getElementById('clues').innerHTML = "";
            document.getElementById('checks').innerHTML = "";

            links = new Array();
            stops = new Array();
            freqs = new Array();
            smax = 0;
	    qcat = false;

            var scr = lang + "w/api.php?format=json&action=parse&page=" + query + "&prop=headhtml|text|links&callback=rContent";

            var elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);

            elem.onload = elem.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
				if (red.parse.headhtml['*'].split('<body')[1].indexOf(' ns-14 ') > 0) qcat = true;
				query = red.parse.title;
                var ls = red.parse.links;
                for (var i = 0; i < ls.length; i++) if (ls[i].ns == 0 && ls[i].exists == "") links.push(ls[i]['*']);

                    document.getElementById("wcont").innerHTML = red.parse.text['*'];
                    var p = document.getElementById("wcont").getElementsByTagName("A");
                    while (p[0]) p[0].parentNode.removeChild(p[0]);

                    var content = document.getElementById("wcont").textContent.replace(/\\(.)/g, " ").replace(puncts, " ").replace(/\./g, " ").replace(/  +/g, " ").split(' ');
                    for (var i = 0; i < content.length; i++) {
                        if (content[i].length == 1) continue;
                        if (content[i].length < 5 && stops.indexOf(content[i].toLowerCase()) < 0) {
                            stops.push(content[i].toLowerCase());
                            freqs.push(1);
                        }
                        else freqs[stops.indexOf(content[i].toLowerCase())]++;
                        smax++;
                    }
                    if (q) {
                        document.getElementById("kF").style.display = 'none';
                        document.getElementById("aF").style.display = 'block';
                        startA();
                    }
                    else {
                        document.getElementById("aF").style.display = 'none';
                        document.getElementById("kF").style.display = 'block';
                        startK();
                    }
                }
            };
        };
        document.getElementById("expand").addEventListener("click", function () {
            document.getElementById("description").style.display = "none";

        function toUint(txt) {
	if (lang.indexOf("/hi.") < 0 && lang.indexOf("/si.") < 0 && lang.indexOf("/mr.") < 0 && lang.indexOf("/ml.") < 0 && lang.indexOf("/nqo.") < 0 && lang.indexOf("/ta.") < 0 && lang.indexOf("/or.") < 0 && lang.indexOf("/gu.") < 0 && lang.indexOf("/pa.") < 0 && lang.indexOf("/bn.") < 0 && lang.indexOf("/as.") < 0 && lang.indexOf("/bo.") < 0 && lang.indexOf("/th.") < 0 && lang.indexOf("/lo.") < 0 && lang.indexOf("/my.") < 0 && lang.indexOf("/km.") < 0 && lang.indexOf("/gom.") < 0 && lang.indexOf("/dty.") < 0 && lang.indexOf("/new.") < 0 && lang.indexOf("/ne.") < 0 && lang.indexOf("/bh.") < 0 && lang.indexOf("/mai.") < 0 && lang.indexOf("/sa.") < 0 && lang.indexOf("/te.") < 0 && lang.indexOf("/sat.") < 0 && lang.indexOf("/tcy.") < 0 && lang.indexOf("/kn.") < 0 && lang.indexOf("/bpy.") < 0 && lang.indexOf("/cu.") < 0 && lang.indexOf("/dv.") < 0 && lang.indexOf("/dz.") < 0 && lang.indexOf("/ks.") < 0 && lang.indexOf("/mnw.") < 0 && lang.indexOf("/pi.") < 0 && lang.indexOf("/shn.") < 0 && lang.indexOf("/cdo.") < 0 && lang.indexOf("/din.") < 0 && lang.indexOf("/pnb.") < 0 && lang.indexOf("/hak.") < 0) return [...txt];

	try {
	    var uint = [];
	    document.getElementById("wcont").textContent = txt;
	    document.getElementById("wcont").focus();

	    while (document.getElementById("wcont").textContent != "") {
                if (document.getElementById("wcont").createTextRange) {
                    var part = document.getElementById("wcont").createTextRange();
                    part.move("character", 0);
                    part.select();
                }
	        else if (document.getElementById("wcont").setSelectionRange) {
                    document.getElementById("wcont").setSelectionRange(0, 0);
                }
	        document.execCommand("forwardDelete", false, null);
		if (txt == document.getElementById("wcont").textContent) {
	            document.getElementById("keyboard").focus();
		    return [...txt];
		}
		uint.push(txt.replace(document.getElementById("wcont").textContent, ""));
		txt = document.getElementById("wcont").textContent;
	    }
	    document.getElementById("keyboard").focus();
	    return uint;
	}
	catch(err) {
	    document.getElementById("keyboard").focus();
	    return [...txt];
	}
	}

        function startA() {

            }

                scr0 = lang + "w/api.php?format=json&action=query&titles=" + query + "&prop=info|categories&cllimit=500&clshow=!hidden&redirects=&list=backlinks&bltitle=" + query + "&blnamespace=0&bllimit=500" + bdir + "&callback=rContent";
            }
            elem0 = document.createElement('script');
            elem0.setAttribute('src', scr0);

            elem0.onload = elem0.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
                    var tds = document.getElementById("00").getElementsByTagName("TD");
                    for (var key in red.query.pages) {
                        if (red.query.pages[key].pagelanguagedir == "rtl") {
                            document.getElementById("00").style.transform = "scaleX(-1)";

			if (red.query.pages[key].categories) {
			    var lls = red.query.pages[key].categories;
			    for (var i = 0; i < lls.length; i++) document.getElementById("clist").innerHTML += "<li title='" + lls[i].title + "' onclick='randP(\"" + lls[i].title + "\");'>⇧ " + lls[i].title.substring(lls[i].title.indexOf(':') + 1) + "</li>";
			}
                    }

                    function anagram(letters) {

                        var anag = new Array();
                        while (orig.length > 0) {
                            var ltr = Math.floor(Math.random() * orig.length);
                            anag.push(orig[ltr]);
                            orig.splice(ltr, 1);
                        }
                        return anag.join('');
                    }
                    function levenshtein(a, b) {
                        if (a.length === 0) return b.length;
                        if (b.length === 0) return a.length;

                        var matrix = [];

                        for (var i = 0; i <= b.length; i++) matrix[i] = [i];
                        for (var j = 0; j <= a.length; j++) matrix[0][j] = j;
                        for (var i = 1; i <= b.length; i++) {
                            for (var j = 1; j <= a.length; j++) {
                                if (b.charAt(i - 1) == a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
                                else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                            }
                        }
                        return matrix[b.length][a.length];
                    }

            for (var m = 1; m <= 25; m++) {
                khtml += '<tr>';
                for (var n = 1; n <= 25; n++) {
                    khtml += '<td><input type="text" id="' + m + '-' + n + '" maxlength="1" class="crypto" readonly></td>';
                }
                khtml += '</tr>';
            }
            document.getElementById("00").innerHTML = khtml;
            document.getElementById('spellcheckinput').value = query;
            document.getElementById('spellcheckinput').style.color = "brown";
	    document.getElementById("clist").innerHTML = "";
            document.getElementById("ahelp").style.opacity = 1;
	    document.getElementById("ahelp").style.cursor = "pointer";

            var tds = document.getElementById("00").getElementsByTagName("TD");
            document.getElementById("00").style.transform = "scaleX(1)";
            for (var i = 0; i < tds.length; i++) tds[i].style.transform = "scaleX(1)";

            var cat = -1, scr0 = lang + "w/api.php?format=json&action=query&titles=" + query + "&prop=info|categories&cllimit=500&clshow=!hidden&redirects=&callback=rContent";

            if (qcat) {
                links = new Array();
                cat = 1;
	        var cdir = "&cmdir=older";
	        if (Math.random() > 0.75) cdir = "";

                scr0 = lang + "w/api.php?format=json&action=query&titles=" + query + "&prop=info|categories&cllimit=500&clshow=!hidden&redirects=&list=categorymembers&cmtitle=" + query + "&cmnamespace=0|14&cmlimit=500&cmsort=timestamp" + cdir + "&callback=rContent";
            }
            else {
                cat = 0;
	        var bdir = "&bldir=descending";
	        if (Math.random() > 0.5) bdir = "";

                scr0 = lang + "w/api.php?format=json&action=query&titles=" + query + "&prop=info|categories&cllimit=500&clshow=!hidden&redirects=&list=backlinks&bltitle=" + query + "&blnamespace=0&bllimit=500" + bdir + "&callback=rContent";
            }
            elem0 = document.createElement('script');
            elem0.setAttribute('src', scr0);
            elem0.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem0);

            elem0.onload = elem0.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
                    for (var key in red.query.pages) {
                        document.getElementById("clist").style.direction = red.query.pages[key].pagelanguagedir;

			if (red.query.pages[key].categories) {
			    var lls = red.query.pages[key].categories;
			    for (var i = 0; i < lls.length; i++) document.getElementById("clist").innerHTML += "<li title='" + lls[i].title + "' onclick='randP(\"" + lls[i].title + "\");'>⇧ " + lls[i].title.substring(lls[i].title.indexOf(':') + 1) + "</li>";
			}
		    }
                    if (cat >= 0) {
                        var ls = [];
                        if (cat == 1 && red.query.categorymembers) ls = red.query.categorymembers;
                        else if (red.query.backlinks) ls = red.query.backlinks;

                        for (var i = 0; i < ls.length; i++) {
			    if (ls[i].ns > 0) {
				document.getElementById("clist").innerHTML += "<li title='" + ls[i].title + "' onclick='randP(\"" + ls[i].title + "\");'>⇩ " + ls[i].title.substring(ls[i].title.indexOf(':') + 1) + "</li>";
				ls[i].title = ls[i].title.split(':')[1];
			    }
			    if (links.indexOf(ls[i].title) < 0) links.push(ls[i].title);
			}
                    }
                    var currentUrl = lang;
                    var alphabet = "";
		    var backup = new Array();
                    var words = new Array();
                    var wwis = new Array();
                    var parts = links.slice(0);

                    while (parts.length > 0) {
                        var pi = Math.round(Math.random() * (parts.length - 1));
                        var txt = parts[pi].split(',')[0].split('(')[0].replace(puncts, ' ').replace(/\./g, " ").trim();
                        var p = txt.split(" ");
                        txt = "";
                        for (var z = 0; z < p.length; z++) if (p[z].length > 1 && p[z].length >= txt.length && p[z] == p[z].replace(/[0-9/\u00A0-\u00BF]/g, '')) txt = p[z];

                        if (txt != "" && alphabet.indexOf(txt.substring(0, txt.length / 2 + 1).toLowerCase()) < 0) {
			    var tu = toUint(txt.toLowerCase());
			    if (txt.toLowerCase() == tu.join('') && tu.length > 1) {
                                alphabet += txt.toLowerCase();
                                words.push(txt.toLowerCase());
                                wwis.push(tu);
                            }
                        }
                        parts.splice(pi, 1);
                    }
                    var mClick = false, mX, mY;
                    var pressed = false, presses = 0;
                    var repeat = 10;
                    var tries = 5;
		    if (words.length < 50) tries = Math.ceil(words.length / 10);
		    document.getElementById("ahelp").innerHTML = "🔓<br />" + tries;

                    var wordi, word, x;
                    var bIndex = new Array(), index = new Array(), found = new Array(), temp = new Array();
                    var check, count, krypto, lexeis, bLexeis, bCount, bKrypto;

                    function cryptic() {
                        word = wwis.slice(0);
                        x = word.length - 1;
                        var indxi;
                        var indx = new Array();
                        count = 0;
                        krypto = new Array();
                        lexeis = new Array();
                        var time = 5 * 25;
                        while (x >= 0 & time > 0) {
                            time--;
                            wordi = Math.round(Math.random() * x);
                            if (word[wordi].length > 25 - 2) { word[wordi] = word[x]; x--; }
                            else {
                                var n = 0;
                                for (i = 0; i < 25; i++) {
                                    for (j = 0; j < 25 + 1 - word[wordi].length; j++) {
                                        indx[n] = [0, 0];
                                        indx[n][0] = i * 25 + j;
                                        indx[n][1] = 0;
                                        n++;
                                        indx[n] = [0, 0];
                                        indx[n][0] = word[wordi].length - 1 + i * 25 + j;
                                        indx[n][1] = 1;
                                        n++;
                                        indx[n] = [0, 0];
                                        indx[n][0] = i + j * 25;
                                        indx[n][1] = 2;
                                        n++;
                                        indx[n] = [0, 0];
                                        indx[n][0] = (word[wordi].length - 1) * 25 + i + j * 25;
                                        indx[n][1] = 3;
                                        n++;
                                    }
                                }
                                for (i = 0; i < 25; i++) {
                                    for (j = 0; j < 25; j++) {
                                        if (i < 25 - word[wordi].length & j < 25 - word[wordi].length) {
                                            indx[n] = [0, 0];
                                            indx[n][0] = i * 25 + j;
                                            indx[n][1] = 4;
                                            n++;
                                        }
                                        if (i > word[wordi].length - 2 & j > word[wordi].length - 2) {
                                            indx[n] = [0, 0];
                                            indx[n][0] = i * 25 + j;
                                            indx[n][1] = 5;
                                            n++;
                                        }
                                        if (i < 25 - word[wordi].length & j > word[wordi].length - 2) {
                                            indx[n] = [0, 0];
                                            indx[n][0] = i * 25 + j;
                                            indx[n][1] = 6;
                                            n++;
                                        }
                                        if (i > word[wordi].length - 2 & j < 25 - word[wordi].length) {
                                            indx[n] = [0, 0];
                                            indx[n][0] = i * 25 + j;
                                            indx[n][1] = 7;
                                            n++;
                                        }
                                    }
                                }
                                indxi = Math.floor(Math.random() * n);
                                index[count] = indx[indxi][0];
                                for (i = 1; i < word[wordi].length; i++) {
                                    if (indx[indxi][1] == 0) {
                                        index[count + i] = indx[indxi][0] + i;
                                    }
                                    if (indx[indxi][1] == 1) {
                                        index[count + i] = indx[indxi][0] - i;
                                    }
                                    if (indx[indxi][1] == 2) {
                                        index[count + i] = indx[indxi][0] + 25 * i;
                                    }
                                    if (indx[indxi][1] == 3) {
                                        index[count + i] = indx[indxi][0] - 25 * i;
                                    }
                                    if (indx[indxi][1] == 4) {
                                        index[count + i] = indx[indxi][0] + (25 + 1) * i;
                                    }
                                    if (indx[indxi][1] == 5) {
                                        index[count + i] = indx[indxi][0] - (25 + 1) * i;
                                    }
                                    if (indx[indxi][1] == 6) {
                                        index[count + i] = indx[indxi][0] + (25 - 1) * i;
                                    }
                                    if (indx[indxi][1] == 7) {
                                        index[count + i] = indx[indxi][0] - (25 - 1) * i;
                                    }
                                }
                                check = true;
                                for (j = 0; j < word[wordi].length; j++) {
                                    for (i = 0; i < count; i++) {
                                        if (index[i] == index[count + j]) {
                                            if (krypto[i] == word[wordi][j]) {
                                                index[count + j] = 10000;
                                            }
                                            else { check = false; break; }
                                        }
                                    }
                                }
                                if (check) {
                                    lexeis.push(word[wordi].join('').normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase());
                                    for (i = 0; i < word[wordi].length; i++) krypto.push(word[wordi][i]);
                                    count += word[wordi].length;
                                    word[wordi] = word[x];
                                    x--;
                                }
                            }
                        }
                        if (repeat == 10) {
                            bLexeis = lexeis.slice(0);
                            bIndex = index.slice(0);
                            bCount = count;
                            bKrypto = krypto;
                        }
                        else {
                            var count1 = 0, count2 = 0;
                            for (j = 1; j <= 25 * 25; j++) {
                                var check1 = true, check2 = true;
                                for (k = 0; k < count; k++) if (index[k] == j) check1 = false;
                                for (k = 0; k < bCount; k++) if (bIndex[k] == j) check2 = false;
                                if (check1) count1++;
                                if (check2) count2++;
                            }
                            if (count1 < count2) {
                                bLexeis = lexeis.slice(0);
                                bIndex = index.slice(0);
                                bCount = count;
                                bKrypto = krypto;
                            }
                        }
                        if (repeat > 0) { repeat--; cryptic(); }
                        lexeis = bLexeis.slice(0);
                        index = bIndex.slice(0);
                        count = bCount;
                        krypto = bKrypto;
                        for (i = 0; i < 25 * 25; i++) {
                            var ro = Math.floor(i / 25 + 1);
                            var co = (i % 25) + 1;
                            check = true;
                            for (j = 0; j < count; j++) {
                                if (index[j] == i) {
                                    document.getElementById(ro + "-" + co).value = krypto[j];
                                    check = false;
                                }
                            }
                            if (check) {
                                var rand = krypto[Math.floor(Math.random() * krypto.length)];
                                document.getElementById(ro + "-" + co).value = rand;
                            }
                        }
                        document.getElementById("clues").innerHTML = lexeis.join("<br />");
                    }
                    var kClick = function (e) {
			if (tries == 0) return;
			tries--;
                        for (i = 0; i < 25 * 25; i++) {
                            var ro = Math.floor(i / 25 + 1);
                            var co = (i % 25) + 1;
                            check = true;
                            for (j = 0; j < count; j++) {
                                if (index[j] == i) { check = false; }
                            }
                            if (check) document.getElementById(ro + "-" + co).style.color = "lightgray";
                        }
                        setTimeout(function () { 
			    if (tries == 0) {
				document.getElementById("ahelp").style.cursor = "not-allowed";
				document.getElementById("ahelp").innerHTML = "🔒";
			    }
		            else document.getElementById("ahelp").innerHTML = "🔓<br />" + tries;
			    clearK();
			}, 1000);
                    };
                    var el = document.getElementById('ahelp'), elClone = el.cloneNode(true);
                    el.parentNode.replaceChild(elClone, el);
                    document.getElementById("ahelp").addEventListener('click', kClick);
                    function clearK() {
                        temp = new Array();
                        mX = 10;
                        mY = 10;
                        document.getElementById("guess").value = "";
                        document.getElementById("guess").style.color = "black";
                        mClick = false;
                        for (j = 1; j <= 25; j++) {
                            for (k = 1; k <= 25; k++) {
                                document.getElementById(j + "-" + k).disabled = false;
                                if (found.indexOf(j + "-" + k) < 0) document.getElementById(j + "-" + k).style.color = "black";
                            }
                        }
                        pressed = false;
                        presses = 0;
                    }
                    cryptic();

                    var cells = document.getElementById("00").getElementsByTagName("TD");
                    for (var i = 0; i < cells.length; i++) {
                        var ro = Math.floor(i / 25 + 1);
                        var co = (i % 25) + 1;

                        backup.push(document.getElementById(ro + "-" + co).value);
                        el = cells[i];
                        elClone = el.cloneNode(true);
                        el.parentNode.replaceChild(elClone, el);

                        function pres(event) {
                            event = event || window.event;
			    event.preventDefault();
                            if (!pressed || document.getElementById(event.target.id).disabled) return false;
                            temp.push(event.target.id);
                            document.getElementById(event.target.id).style.color = "orange";
                            document.getElementById("guess").value += document.getElementById(event.target.id).value;

                            var prosor = document.getElementById("guess").value;
                            if (lexeis.indexOf(prosor.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase()) >= 0) {
                                document.getElementById("guess").style.color = "green";
                                found = found.concat(temp);
                                lexeis.splice(lexeis.indexOf(prosor.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase()), 1);
                                document.getElementById("clues").innerHTML = lexeis.join("<br />");
                                setTimeout(function () { clearK(); }, 2000);
                            }
                            else if ((alphabet.normalize('NFD').replace(/[\u0300-\u036f]/g, "").indexOf(prosor.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase()) < 0 && alphabet.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").indexOf(prosor.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toUpperCase()) < 0) || (event.target.id.split("-")[0].replace("k", "") == "1" && mX == 2) || (event.target.id.split("-")[0].replace("k", "") == 25 + "" && mX == 25 - 1) || (event.target.id.split("-")[1] == "1" && mY == 2) || (event.target.id.split("-")[1] == 25 + "" && mY == 25 - 1)) setTimeout(function () { clearK(); }, 500);
                            else if (mClick) { hide(event.target.id.split("-")[0].replace("k", ""), event.target.id.split("-")[1]); }
                            else {
                                mX = event.target.id.split("-")[0].replace("k", "");
                                mY = event.target.id.split("-")[1];
                                for (j = 1; j <= 25; j++) {
                                    for (k = 1; k <= 25; k++) {
                                        document.getElementById(j + "-" + k).disabled = true;
                                        if (Math.abs(j - mX) <= 1 && Math.abs(k - mY) <= 1) document.getElementById(j + "-" + k).disabled = false;
                                    }
                                }
                                mClick = true;
                            }
                            document.getElementById(event.target.id).disabled = true;
			    if (document.getElementById("clues").innerHTML == "") {
				setTimeout(function () { document.getElementById("kF").style.opacity = 0.5; }, 1000);
				setTimeout(function () { document.getElementById("congrats").style.display = "block"; }, 2000);
				setTimeout(function () { document.getElementById("congrats").style.display = "none"; }, 4500);
				setTimeout(function () { document.getElementById("kF").style.opacity = 1; }, 5000);
			    }
                            presses++;
                            if (presses <= 1) pressed = false;
                        }
                        cells[i].addEventListener('mousedown', function(event) { pressed = true; });
                        cells[i].addEventListener('mousedown', pres);
                        cells[i].addEventListener('mouseover', pres);
                    }
                    var chk1 = false, chk2 = false;

                    if (backup.join('').toLowerCase() !== backup.join('').toUpperCase()) {
                        document.getElementById("checks").innerHTML += '<input type="checkbox" id="rad1" checked />A';
                        chk1 = true;
                    }
                    if (backup.join('').normalize('NFD').replace(/[\u0300-\u036f]/g, "") !== backup.join('').normalize('NFD')) {
                        document.getElementById("checks").innerHTML += '<input type="checkbox" id="rad2" />á';
                        chk2 = true;
                    }
                    if (chk1) {
                        document.getElementById("rad1").addEventListener('change', function (event) {
                            clearK();
                            for (i = 0; i < 25 * 25; i++) {
                                var ro = Math.floor(i / 25 + 1);
                                var co = (i % 25) + 1;
                                var box = document.getElementById(ro + "-" + co);

                                if (this.checked && box.value.toUpperCase().length == 1) box.value = box.value.toUpperCase();
                                else box.value = backup[i];
                                if (document.getElementById("rad2") && !document.getElementById("rad2").checked) box.value = box.value.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
                            }
                        });
                        document.getElementById("rad1").dispatchEvent(new Event('change'));
                    }
                    if (chk2) {
                        document.getElementById("rad2").addEventListener('change', function (event) {
                            clearK();
                            for (i = 0; i < 25 * 25; i++) {
                                var ro = Math.floor(i / 25 + 1);
                                var co = (i % 25) + 1;
                                var box = document.getElementById(ro + "-" + co);

                                if (this.checked) box.value = backup[i];
                                else box.value = box.value.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();

                                if (document.getElementById("rad1") && document.getElementById("rad1").checked && box.value.toUpperCase().length == 1) box.value = box.value.toUpperCase();
                            }
                        });
                        document.getElementById("rad2").dispatchEvent(new Event('change'));
                    }
                    function hide(x, y) {
                        for (j = 1; j <= 25; j++) {
                            for (k = 1; k <= 25; k++) {
                                document.getElementById(j + "-" + k).disabled = false;
                                if ((j - x) != (x - mX) || (k - y) != (y - mY)) document.getElementById(j + "-" + k).disabled = true;
                            }
                        }
                        document.getElementById(x + "-" + y).style.color = "orange";
                        document.getElementById(x + "-" + y).disabled = true;
                        mX = x;
                        mY = y;
                    }
                }
            };
        }
    </script>
