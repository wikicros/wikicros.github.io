<html>
<head>
    <meta charset="utf8">
    <title>WikiCuiz</title>
    <link rel="icon" href="../icons/wikicuiz.png" />
    <style>
		body {
      background-color: whitesmoke;
		}
	.buttons {
            font-size: large;
	    font-weight: bolder;
	    min-height: 3em;
	    padding: 1em;
	    margin: 1%;
	}
        #nq {
            background-color: whitesmoke;
            background-repeat: no-repeat;
            background-size: contain;
            height: 100%;
        }
        #app {
            background-color: whitesmoke;
            background-repeat: no-repeat;
            background-size: contain;
            height: 100%;
            color: whitesmoke;
        }
        #drop_down {
            padding: 1em;
            position: absolute;
            display: none;
            background: silver;
            cursor: pointer;
            list-style-type: none;
            box-shadow: 5px 5px 3px 0px rgba(0,0,0,0.5);
        }
        #result {
            font-size: 100px;
	    width: 100%;
	    text-align: center;
	    display: none;
          position: absolute;
          left: 0;
          top: 50px;
          text-shadow: 3px 6px 9px silver;
        }
    </style>
    <script type="text/javascript">cookieChoices = {};</script>
</head>
<body>
    <div id="gui" style="height:35px">
        <select style="height:100%" id="lang" onchange="getjs(event);"></select>
        <input style="width:25em;height:100%;padding-right:25px" id="spellcheckinput" onkeyup="getjs(event);" type="text" />
        <span title="RANDOM" style="margin-left:-25px;margin-right:25px;cursor:pointer" onclick="randP('');">↻</span>
	&#8987;&nbsp;<input type="number" title="SECONDS" style="width:4em;height:100%" id="secs" value="10" min="1" max="60" />
        &nbsp;<button type="button" id="nq" title="NEW QUIZ" onclick="go(false);"  style="background-image:url('../icons/wikicuiz.png')">_</button>
        <button type="button" id="app" title="TEXT VERSION" onclick="go(true);" style="height:100%;float:right">📃</button>
    </div>
    <br />
    <div id="answer"></div>
    <div id="quests"></div>
    <div id="result"></div>
    <ul id="drop_down"></ul>
    <script type="text/javascript">
        var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var newDate = new Date();
        var query = monthNames[newDate.getMonth()] + " " + parseInt(newDate.toDateString().split(' ')[2]);
        var lang = "https://en.wikipedia.org/";
	var total, correct, cat0, que0, cats, ques, interval, all_titles, newQuiz;
	var disl = new Array(), dist = new Array();
		
        if (window.location.href.indexOf('l=') > 0) {
            lang = window.location.href.split("l=")[1].split('&')[0];
            lang = "https://" + lang + ".wikipedia.org/";
            query = decodeURI(window.location.href.split("q=")[1].split("?")[0]);
        }
	var lstub = ["ar", "azb", "az", "ba", "bh", "bn", "bs", "ce", "ckb", "cv", "cy", "el", "fa", "fr", "he", "hi", "ilo", "inh", "ja", "kk", "ko", "ky", "lb", "lv", "mk", "ml", "ms", "mt", "my", "oc", "pt", "pt", "ru", "sl", "sr", "sv", "tg", "th", "tr", "tt", "tt", "uk", "ur", "vi", "yi", "zh-yue", "zh"];

	var stubs = new Array();
	stubs.push("بذرة"); stubs.push("قارالاما"); stubs.push("qaralamalar‎"); stubs.push("тамамланмаған мәҡәләләр"); stubs.push("आधार"); stubs.push("অসম্পূর্ণ"); stubs.push("U začetku"); stubs.push("Бовланза яззамаш"); stubs.push("ەکانی"); stubs.push("вĕçлемен статьясем"); stubs.push("Egin"); stubs.push("επέκταση"); stubs.push("خرد"); stubs.push("ébauche"); stubs.push("קצרמר"); stubs.push("आधार"); stubs.push("pungol nga artikulo"); stubs.push("йола йистеяьннайоаца статьяш"); stubs.push("スタブ"); stubs.push("аяқталмаған мақалалар"); stubs.push("토막글"); stubs.push("бүтүрүлбөгөн макалалар"); stubs.push("Skizz"); stubs.push("Nepabeigti raksti"); stubs.push("никулци"); stubs.push("അപൂർണ്ണ"); stubs.push("Tunas"); stubs.push("Abbozzi"); stubs.push("ဆောင်းပါးတို"); stubs.push("Esbòs"); stubs.push("!Esboço"); stubs.push("!Artigos mínimos"); stubs.push("Незавершённые статьи"); stubs.push("škrbine"); stubs.push("клице"); stubs.push("stubbar"); stubs.push("Мақолаҳои нопурра"); stubs.push("ที่ยังไม่สมบูรณ์‎"); stubs.push("taslak"); stubs.push("тәмамланмаган мәкаләләр‎"); stubs.push("эшләп бетерелмәгән мәкаләләр"); stubs.push("Незавершені статті"); stubs.push("نامکمل‏"); stubs.push("sơ khai"); stubs.push("שטומף"); stubs.push("楔類"); stubs.push("小作品");

        function selectQ(q) {
            query=q;
            document.getElementById("drop_down").style.display = 'none';
            document.getElementById("spellcheckinput").value = query;
            document.getElementById('spellcheckinput').style.color = "black";
            document.getElementById('nq').disabled = false;
            document.getElementById('nq').style.opacity = 1;
	    go(false);
        }
        document.getElementById("spellcheckinput").value = query;

        var red, rContent = function (data) {
            red = JSON.parse(JSON.stringify(data));
        };
        var scr = "https://el.wikipedia.org/w/api.php?format=json&action=parse&page=Κατηγορία:Αποσαφήνιση&prop=langlinks&callback=rContent";

        var elem = document.createElement('script');
        elem.setAttribute('src', scr);
        elem.setAttribute('type', 'text/javascript');
        document.getElementsByTagName('head')[0].appendChild(elem);

        elem.onload = elem.onreadystatechange = function () {
            if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
                var lhtml = "", checkel = true;
                var lls = red.parse.langlinks;
                for (var i = 0; i < lls.length; i++) {
                    if (checkel && lls[i].lang > "el") {
                        if (lang == "https://el.wikipedia.org/") lhtml += '<option value="https://el.wikipedia.org/" selected>Ελληνικά</option>';
                        else lhtml += '<option value="https://el.wikipedia.org/">Ελληνικά</option>';
                        checkel = false;
                    }
                    var lval = "https://" + lls[i].lang + ".wikipedia.org/";
                    if (lval == lang) lhtml += '<option value="' + lval + '" selected>' + lls[i].autonym + '</option>';
                    else lhtml += '<option value="' + lval + '">' + lls[i].autonym + '</option>';

                    disl.push(lls[i].lang);
                    dist.push(lls[i]['*']);
                }
                disl.push('el');
                dist.push('Κατηγορία:Αποσαφήνιση');

                document.getElementById("lang").innerHTML += lhtml;
                go(false);
            }
        };
        var spellcheck = function (data) {
            var text = data[0];

            document.getElementById('spellcheckinput').style.color = "silver";
            document.getElementById('nq').disabled = true;
            document.getElementById('nq').style.opacity = 0.5;

            if (text != document.getElementById('spellcheckinput').value)
                return;

            document.getElementById('drop_down').innerHTML = "";
            document.getElementById('drop_down').style.left = document.getElementById("spellcheckinput").offsetLeft + "px";
            document.getElementById('drop_down').style.top = document.getElementById("spellcheckinput").offsetTop + document.getElementById("spellcheckinput").offsetHeight + "px";

            if (data[1].length > 0) document.getElementById('drop_down').style.display = "block";

            for (var i = 0; i < data[1].length; i++) document.getElementById('drop_down').innerHTML += "<li onclick='selectQ(this.innerHTML);'>" + data[1][i] + "</li>";

            if (text.toLowerCase().trim() == data[1][0].toLowerCase()) {
                document.getElementById('spellcheckinput').style.color = "black";
                document.getElementById('nq').disabled = false;
                document.getElementById('nq').style.opacity = 1;
            }
        };
        function getjs(event) {
	    clearTimeout(interval);

            lang = document.getElementById('lang').value;
            var q = document.getElementById('spellcheckinput').value;

            if (q != "" && event.keyCode === 13) {
                selectQ(q);
                return;
            }
            var scr = lang + 'w/api.php?action=opensearch&search=' + q + '&format=json&limit=25&callback=spellcheck';

            var elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);
        }
        var randP = function (q) {
	    clearTimeout(interval);

            scr = lang + 'w/api.php?action=query&generator=random&grnlimit=500&grnnamespace=0&prop=categories&format=json&callback=rContent';
			
            elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);
            elem.onload = elem.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
		    var maxl = 0;
                    for (var key in red.query.pages) {
			if (red.query.pages[key].categories === undefined) continue;

			var length = 0;
			for (var k in red.query.pages[key].categories) length++;

                       	if (length > maxl) {
                    	   query = red.query.pages[key].title;
                           maxl = length;
                       	}
                        if (length >= 10) break;
                    }
                    document.getElementById('spellcheckinput').value = query;
                    document.getElementById('spellcheckinput').style.color = "black";
                    document.getElementById('nq').disabled = false;
                    document.getElementById('nq').style.opacity = 1;
                    go(false);
                }
            };
        };
        function go(q) {
	    clearTimeout(interval);
	    newQuiz = true;

            query = document.getElementById("spellcheckinput").value;
            document.getElementById("drop_down").style.display = 'none';
            document.getElementById("result").style.display = 'none';

            scr = lang + "w/api.php?format=json&action=query&generator=search&gsrsearch=" + query.substring(query.indexOf(':') + 1) + "&gsrlimit=25&prop=categories&cllimit=500&clshow=!hidden&callback=rContent";

            elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);

            elem.onload = elem.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
	    	    total = 0;
	    	    correct = 0;

	    	    document.getElementById("quests").innerHTML = "";
       	    	    document.getElementById("answer").innerHTML = "";

	            que0 = new Array();
	    	    cat0 = new Array();
	            ques = new Array();
	    	    cats = new Array();

                    for (var key in red.query.pages) {
                        var t = red.query.pages[key].title.split(" (")[0];

		        for (var k in red.query.pages[key].categories) {
			    var c = red.query.pages[key].categories[k].title;
			    if(notDis(c) && notForb(c) && notStub(c) && cats.indexOf(c) < 0 && compare(t, c)) {
			        ques.push(t);
			        cats.push(c);
			    }
			    que0.push(t);
			    cat0.push(c);
		        }
                    }
                    all_titles = new Array();
		    next(q);
                }
            };
        }
        function notForb(a) {
	    var forbs = [" stubs", " pages", " articles", "pages ", "articles ", "infobox", "geobox", "wikidata", "wikipedia", "cs1", "isbn magic", "webarchive "];
	    for (var i = 0; i < forbs.length; i++) if (a.toLowerCase().indexOf(forbs[i]) >= 0) return false;
	    return true;
	}
        function notStub(a) {
	    var la = lang.split("://")[1].split('.')[0];
	    if (lstub.indexOf(la) < 0) return true;

	    var l1 = lstub.indexOf(la);
	    var l2 = lstub.lastIndexOf(la);

	    if (a.toLowerCase().indexOf(stubs[l1].toLowerCase()) >= 0) return false;
	    if (a.toLowerCase().indexOf(stubs[l2].toLowerCase()) >= 0) return false;

	    return true;
	}
        function compare(a, b) {
	    b = b.substring(b.indexOf(':') + 1);
	    if (a.replace(/[0-9/\u00A0-\u00BF]/g, '') != a && b.replace(/[0-9/\u00A0-\u00BF]/g, '') != b) return false;

            var puncts = /[!-.:;=?@\[\]^_`{-~\u00A1\u00A7\u00AB\u00B6\u00B7\u00BB\u00BF\u037E\u0387\u055A-\u055F\u0589\u058A\u05BE\u05C0\u05C3\u05C6\u05F3\u05F4\u0609\u060A\u060C\u060D\u061B\u061E\u061F\u066A-\u066D\u06D4\u0700-\u070D\u07F7-\u07F9\u0830-\u083E\u085E\u0964\u0965\u0970\u0AF0\u0DF4\u0E4F\u0E5A\u0E5B\u0F04-\u0F12\u0F14\u0F3A-\u0F3D\u0F85\u0FD0-\u0FD4\u0FD9\u0FDA\u104A-\u104F\u10FB\u1360-\u1368\u1400\u166D\u166E\u169B\u169C\u16EB-\u16ED\u1735\u1736\u17D4-\u17D6\u17D8-\u17DA\u1800-\u180A\u1944\u1945\u1A1E\u1A1F\u1AA0-\u1AA6\u1AA8-\u1AAD\u1B5A-\u1B60\u1BFC-\u1BFF\u1C3B-\u1C3F\u1C7E\u1C7F\u1CC0-\u1CC7\u1CD3\u2010-\u2027\u2030-\u2043\u2045-\u2051\u2053-\u205E\u207D\u207E\u208D\u208E\u2329\u232A\u2768-\u2775\u27C5\u27C6\u27E6-\u27EF\u2983-\u2998\u29D8-\u29DB\u29FC\u29FD\u2CF9-\u2CFC\u2CFE\u2CFF\u2D70\u2E00-\u2E2E\u2E30-\u2E3B\u3001-\u3003\u3008-\u3011\u3014-\u301F\u3030\u303D\u30A0\u30FB\uA4FE\uA4FF\uA60D-\uA60F\uA673\uA67E\uA6F2-\uA6F7\uA874-\uA877\uA8CE\uA8CF\uA8F8-\uA8FA\uA92E\uA92F\uA95F\uA9C1-\uA9CD\uA9DE\uA9DF\uAA5C-\uAA5F\uAADE\uAADF\uAAF0\uAAF1\uABEB\uFD3E\uFD3F\uFE10-\uFE19\uFE30-\uFE52\uFE54-\uFE61\uFE63\uFE68\uFE6A\uFE6B\uFF01-\uFF03\uFF05-\uFF0A\uFF0C-\uFF0F\uFF1A\uFF1B\uFF1F\uFF20\uFF3B-\uFF3D\uFF3F\uFF5B\uFF5D\uFF5F-\uFF65]+/g;

	    a = a.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();
	    b = b.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();

	    if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return false;

	    var pa = a.replace(puncts, " ").replace(/[0-9/\u00A0-\u00BF]/g, ' ').replace(/  +/g, " ").split(' ');
	    var pb = b.replace(puncts, " ").replace(/[0-9/\u00A0-\u00BF]/g, ' ').replace(/  +/g, " ").split(' ');

	    for (var i = 0; i < pa.length; i++) {
		if (pa[i].length == 1 || pa.length > 1 && pa[i].length < 5) continue;
		if (b.indexOf(pa[i].substring(0, pa[i].length / 2 + 1)) >= 0) return false;
	    }
	    for (var i = 0; i < pb.length; i++) {
		if (pb[i].length == 1 || pb.length > 1 && pb[i].length < 5) continue;
		if (a.indexOf(pb[i].substring(0, pb[i].length / 2 + 1)) >= 0) return false;
	    }
	    return true;
	}
        function notDis(a) {
	    var la = lang.split("://")[1].split('.')[0];
	    if (disl.indexOf(la) < 0) return true;
	    var t = dist[disl.indexOf(la)];
	    return compare(a, t);
	}
        function win(q) {
	    clearTimeout(interval);

       	    document.getElementById("right").style.color = "darkolivegreen";
       	    document.getElementById("wrong").style.color = "firebrick";
       	    document.getElementById("right").disabled = true;
       	    document.getElementById("wrong").disabled = true;

	    if (q) {
	        document.getElementById("result").innerHTML = "&#10003;";
       	        document.getElementById("result").style.color = "darkolivegreen";
		correct++;
	    }
	    else {
	        document.getElementById("result").innerHTML = "&#10007;";
       	        document.getElementById("result").style.color = "firebrick";
	    }
       	    document.getElementById("result").style.display = "block";

            total++;
	    setTimeout(function () { next(false); }, 500);
	}
        function next(_q) {
	    clearTimeout(interval);
	    newQuiz = false;

	    if (cats.length == 0) {
		if (total == 0) {
		    alert("\nSorry,\nit seems there are not enough Wikipedia categories related to this article!\n\nPlease try to create a new quiz from another Wikipedia page...\n");
                    return;
	        }
		if (_q) {
		    var r = confirm("PRINT THIS QUIZ?");
		    if (r == true) {
			var mywindow = window.open('', 'PRINT');
			mywindow.document.write('<h3>' + document.title  + ' (' + query + ')</h3>');
			mywindow.document.write(document.getElementById("quests").innerHTML);
			mywindow.document.close();
			mywindow.focus();
			mywindow.print();
			mywindow.close();
		    }
		    return;
		}
		setTimeout(function () {
		document.getElementById("quests").innerHTML = "";
        	document.getElementById("answer").innerHTML = "";

		var final = Math.round(correct / total * 10000) / 100;

		if (final > 75) document.getElementById("result").style.color = "darkolivegreen";
		else if (final > 50) document.getElementById("result").style.color = "cadetblue";
		else if (final > 25) document.getElementById("result").style.color = "darkgoldenrod";
		else document.getElementById("result").style.color = "firebrick";

	    	document.getElementById("result").innerHTML = "<br />" + final + "%";
	    	document.getElementById("result").style.opacity = 0.75;
		}, 2500);
		return;
	    }
	    var ique = Math.round(Math.random() * (cats.length - 1));
	    var clue = ques[ique];
	    var titl = cats[ique];

	    var titles = cat0.slice(que0.indexOf(clue), que0.lastIndexOf(clue) + 1);

       	    ques.splice(ique, 1);
       	    cats.splice(ique, 1);

	    var gdir = "&gcmdir=older";
	    if (Math.random() > 0.75) gdir = "";

            scr = lang + "w/api.php?format=json&action=query&generator=categorymembers&gcmnamespace=0&gcmlimit=25&gcmsort=timestamp" + gdir + "&gcmtitle=" + titl + "&prop=categories&cllimit=500&clshow=!hidden&callback=rContent";

            elem = document.createElement('script');
            elem.setAttribute('src', scr);
            elem.setAttribute('type', 'text/javascript');
            document.getElementsByTagName('head')[0].appendChild(elem);

            elem.onload = elem.onreadystatechange = function () {
                if (!this.readyState || this.readyState === "loaded" || this.readyState === "complete") {
		    if (newQuiz) return;
		    if (red.query === undefined || red.batchcomplete === undefined) { next(_q); return; }

		    var qext = new Array();
		    var cext = new Array();

                    for (var key in red.query.pages) {
			var q = red.query.pages[key].title.split(" (")[0];
			if (q == clue || !compare(q, titl)) continue;

			for (var k in red.query.pages[key].categories) {
			    var t = red.query.pages[key].categories[k].title;

			    if(notDis(t) && notForb(t) && notStub(t) && titles.indexOf(t) < 0 && titl.toLowerCase().indexOf(t.substring(t.lastIndexOf(':') + 1).toLowerCase()) < 0 && compare(clue, t)) {
			        qext.push(q);
			        cext.push(t);
			    }
			}
		    }
	    	    var c = "", quiz = new Array(), backup = new Array();

		    while (cext.length > 0) {
	    	        var index = Math.round(Math.random() * (cext.length - 1));
		        
			c = cext[index];
	    	        quiz = new Array();
		        quiz.push(c);
		        quiz.push(clue);

		        while (index >= 0) {
			    if (all_titles.indexOf(c) < 0 && quiz.indexOf(qext[index]) < 0 && compare(qext[index], titl) && compare(qext[index], c)) quiz.push(qext[index]);

                       	    qext.splice(index, 1);
                       	    cext.splice(index, 1);

		            index = cext.indexOf(c);
		        }
		        if (!compare(c.substring(c.indexOf(':') + 1), titl) && quiz.length > 3 || quiz.length > 5) break;
		        if (quiz.length > backup.length || Math.random() > 0.5 && quiz.length == backup.length) backup = quiz.slice(0);
			if (cext.length == 0) quiz = backup.slice(0);
		    }
		    if (quiz.length < 3) { next(_q); return; }

		    if (!_q) document.getElementById("quests").innerHTML = "";
        	    document.getElementById("answer").innerHTML = "";
        	    document.getElementById("result").style.display = "none";

		    var count = 0;
		    var quizzes = new Array();

		    while (count <= 3 && quiz.length > 1) {
			var qi = 1 + Math.round(Math.random() * (quiz.length - 2));
			if (_q) document.getElementById("quests").innerHTML += "<i style='float:right;margin-right:0.25em'>" + quiz[qi] + "</i><br />";
			else document.getElementById("quests").innerHTML += "<button class='buttons' style='width:90%;color:cadetblue' disabled>" + quiz[qi] + "</button>";
			quizzes.push(quiz[qi]);
                       	quiz.splice(qi, 1);
		        count++;
		    }
		    if (quizzes.indexOf(clue) < 0) {
			var qi = Math.round(Math.random() * (quizzes.length - 1));
			document.getElementById("quests").innerHTML = document.getElementById("quests").innerHTML.replace(quizzes[qi], clue);
		    }
		    if (_q) {
			var wr = "▢ <b>" + quiz[0].substring(quiz[0].indexOf(':') + 1) + "</b>";
			if (Math.random() < 0.5) wr = "▢ <b>" + titl.substring(titl.indexOf(':') + 1) + "</b><br />" + wr;
			else wr += "<br />▢ <b>" + titl.substring(titl.indexOf(':') + 1) + "</b>";
			document.getElementById("quests").innerHTML += wr + "<hr />";
			total++;
			next(_q);
			return;
		    }
		    else document.getElementById("answer").innerHTML += "<button class='buttons' id='right' onclick='win(true)' style='width:40%;color:darkgoldenrod'>" + titl.substring(titl.indexOf(':') + 1) + "</button>";

		    var wrong = "<button class='buttons' id='wrong' onclick='win(false)' style='width:48%;color:darkgoldenrod'>" + quiz[0].substring(quiz[0].indexOf(':') + 1) + "</button>";
		    if (Math.random() < 0.5) document.getElementById("answer").innerHTML += wrong;
		    else document.getElementById("answer").innerHTML = wrong + document.getElementById("answer").innerHTML;

		    all_titles.push(quiz[0]);
		    interval = setTimeout(function () { win(false); }, 1000 * document.getElementById("secs").value);
                }
