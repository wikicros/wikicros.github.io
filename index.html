<html>
<head>
  <title>Wikipedia Crossword</title>
  <link rel="icon" href="icons/wikicros.png" />
  <style>
    body {
      background-image: linear-gradient(to bottom right, black, dimgray);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      width: 100%;
      cursor: pointer;
      opacity: 0.25;
    }
    img:hover {
      transform: scale(1.2);
      opacity: 1;
    }
    table {
      border-spacing: 10px;
    }
    td {
      width: 64px;
      height: 64px;
      padding: 10px;
      background-color: whitesmoke;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td><img src="icons/wikicuiz.png" onclick="window.location.href = &quot;/wikicuiz/&quot;" title="WikiCuiz: select the most relevant wikipedia category before time runs out." /></td>
      <th></th><th></th><th></th>
      <td><img src="icons/wikilign.png" onclick="window.location.href = &quot;/wikilign/&quot;" title="WikiLign: put the cards in the right chronological order." /></td>
    </tr>
      <td><img src="icons/windows.png" onclick="window.location.href = &quot;https://apps.microsoft.com/detail/9pn58f5vkp5t&quot;" title="WikiCuiz: download and install the Windows version from Microsoft Store." /></td>
      <th></th>
      <td><img src="icons/wikicros.png" onclick="window.location.href = &quot;/wikicros/&quot;" title="WikiCros: word search and criss-cross puzzles in more than 250 languages." /></td>
      <th></th>
      <td><img src="icons/chrome.png" onclick="window.location.href = &quot;https://chromewebstore.google.com/detail/wikicros-wikipedia-crossw/cgieemijomeaiaoojiobafbgkebdjccc&quot;" title="WikiCros: download the extension from Chrome Web Store and add it to your browser." /></td>
    <tr>
      <th></th>
      <td><img src="icons/editor.png" onclick="window.location.href = &quot;/editor/&quot;" title="WikiCros Editor: customize and print your wikipedia crossword puzzles." /></td>
      <th></th>
      <td><img src="icons/wikicros.png" onclick="window.location.href = &quot;/wiktionary/&quot;" title="Wikicros beta (for language learners): wiktionary-based bilingual puzzles to enhance your vocabulary and grammatical skills." style="filter:invert(100%)" /></td>
      <th></th>
    </tr>
  </table>
</body>
</html>
